<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
    <style>
        p {
            position: absolute;
            background-color: beige;
            margin: 25px;
            border: 5px solid red;
            border-radius: 15px;
            color: black;
            padding: 25px;
        }

        p:hover {
            background-color: lightgrey;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 600;
            font-style: italic;
        }
    </style>
</head>
<body>
    <p>Amadis</p>
</body>
</html>
