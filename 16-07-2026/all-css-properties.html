<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Properties</title>
    <style>
        .one {

            /* Box Model Properties */
            width: 300px;
            height: 200px;
            margin-top: 100px;
            margin-left: 100px;
            padding: 50px 50px 50px 50px;
            box-shadow: 5px 5px 40px gray;

            /* Background Properties */
            background: lightyellow;
            background-image: url("bgc.jpg");
            background-repeat: no-repeat;

            /* Text Properties */
            text-align: center;
            text-transform: capitalize;
            text-decoration: underline;
            text-indent: 10px;
            text-shadow: 2px 2px 5px gray;

            /* Font Properties */
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 20px;
            font-weight: 500;
            font-style: italic;

            /* Color Properties */
            color: white;
            opacity: 0.9;

            /* Border Properties */
            border: 5px solid black;
            border-radius: 20px;

            /* Display Properties */
            display: block;

            /* Position Properties */
            position: absolute;
            top: 20px;
            bottom: 20px;
            right: 10px;
            left: 20px;
            z-index: 10;

            /* Cursor Properties */
            cursor: pointer;

        }

        p:active {
            color: red;
        }

        p:hover {
            /* Transform Properties */
            transform: scale(1.2);

            /* Transistion Properties */
            transition: all 1s ease;
            transition-delay: 0.6s; 

            /* Animation Property */
            animation: move;
            animation-duration: 2s;
            animation-delay: 1s;
        }

        input:focus {
            border: 3px solid grey;
            outline: none;
        }

        body {
            background-color: blueviolet;
        }

        @media(max-width:750px){
            body {
                background-color: lightseagreen;
            }
        }

        @media(max-width:550px) {
            body {
                background-color: lightpink;
            }
        }
    </style>
</head>

<body>
    <p class="one">Hello Vijay</p> <br> <br>
    Enter Fullname : <input type="text" name="name" id="name">
</body>

</html>
