<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Name Document</title>
    <style>
        .container {
            display: grid;
            justify-content: center;
            grid-template-rows: 1fr 2fr 1fr;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="p-tag">Hi Vijay</p>
        <h2 class="h2-tag">Amadis</h2>
        <p class="p-tag">Nagercoil</p>
    </div>
    
    <script>
        document.querySelector(".h2-tag").addEventListener("mouseover", function(){
            let elements = document.getElementsByClassName("p-tag");
            for(let i = 0; i < elements.length; i++){
                elements[i].style.color = "Red";
            }
            document.querySelector(".h2-tag").style.cursor = "pointer";
        })

        document.querySelector(".h2-tag").addEventListener("mouseout", function(){
            let elements = document.getElementsByClassName("p-tag");
            for(let i = 0; i < elements.length; i++){
                elements[i].style.color = "Black";
            }
        })
    </script>
</body>
</html>
